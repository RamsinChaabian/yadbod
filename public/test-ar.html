<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Test — LocAR.js (Real Device)</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* صفحه شروع */
        .ar-start-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
            color: #fff;
            z-index: 1000;
            padding: 20px;
            text-align: center;
        }
        .ar-start-screen h1 { font-size: 22px; margin-bottom: 10px; }
        .ar-start-screen p { font-size: 14px; opacity: 0.7; margin-bottom: 30px; max-width: 300px; }
        .ar-start-btn {
            background: #E8833A;
            color: #fff;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(232,131,58,0.5);
        }
        .ar-start-btn:active { transform: scale(0.97); }

        /* لایه AR */
        .ar-stage { display: none; position: fixed; inset: 0; }
        .ar-stage.active { display: block; }

        .ar-label {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 20px; font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 10;
        }
        .ar-debug {
            position: absolute; top: 10px; left: 10px;
            color: #0f0; font-size: 11px;
            background: rgba(0,0,0,0.6);
            padding: 6px 8px; border-radius: 4px;
            z-index: 100; font-family: monospace;
            max-width: 200px; line-height: 1.4;
        }
    </style>
    <script src="/vendor/ar/aframe.min.js"></script>
    <script src="/vendor/ar/locar.js"></script>
    <script>window.LocAR = window.locar;</script>
    <script src="/vendor/ar/locar-aframe.js"></script>
</head>
<body>

    <!-- صفحه شروع -->
    <div class="ar-start-screen" id="start-screen">
        <div style="font-size: 60px; margin-bottom: 20px;">📷</div>
        <h1>تست AR</h1>
        <p>برای شروع، دکمه زیر را بزنید و به دوربین و موقعیت اجازه دسترسی بدهید.</p>
        <button class="ar-start-btn" id="start-btn">شروع تست</button>
    </div>

    <!-- لایه AR -->
    <div class="ar-stage" id="ar-stage">
        <div class="ar-debug" id="debug"></div>
        <div class="ar-label">اینجاست 📍</div>

        <a-scene
            embedded
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            renderer="antialias: true; alpha: true"
            style="width: 100%; height: 100%;"
        >
            <a-camera
                locar-camera="positionMinAccuracy: 20; smoothingFactor: 5; enablePermissionDialog: false"
            ></a-camera>

            <a-entity
                locar-entity-place="latitude: 32.0498053; longitude: 48.8765405"
            >
                <a-ring color="#E8833A" radius-inner="0.8" radius-outer="1.2"
                        rotation="-90 0 0" position="0 0.05 0"
                        material="opacity: 0.9; transparent: true; side: double">
                </a-ring>
                <a-cylinder color="#F5A623" radius="0.15" height="3"
                            position="0 1.5 0"
                            material="opacity: 0.6; transparent: true">
                </a-cylinder>
            </a-entity>
        </a-scene>
    </div>

    <script>
        const debugEl = document.getElementById('debug');
        const log = (msg) => {
            console.log(msg);
            if (debugEl) debugEl.innerHTML += '<br>' + msg;
        };

        window.addEventListener('error', (e) => {
            console.error('[TEST-AR] Error:', e.error || e.message);
            if (debugEl) debugEl.innerHTML += '<br><span style="color:#f00">ERR: ' + (e.error?.message || e.message) + '</span>';
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            console.log('[TEST-AR] start clicked');

            // ۱. مخفی کردن صفحه شروع، نمایش AR
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ar-stage').classList.add('active');

            // ۲. درخواست صریح دوربین (باعث trigger permission می‌شود)
            try {
                log('Requesting camera permission...');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                });
                stream.getTracks().forEach(t => t.stop());
                log('Camera permission granted ✓');
            } catch (err) {
                log('Camera denied: ' + err.message);
                return;
            }

            // ۳. درخواست موقعیت
            try {
                log('Requesting GPS...');
                await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 15000,
                    });
                });
                log('GPS acquired ✓');
            } catch (err) {
                log('GPS denied: ' + err.message);
                return;
            }

            // ۴. بررسی کتابخانه‌ها
            setTimeout(() => {
                log('AFRAME: ' + !!window.AFRAME);
                log('LocAR global: ' + !!window.LocAR);
                log('locar-camera: ' + !!(window.AFRAME?.components['locar-camera']));

                // ۵. آیا فید دوربین در A-Frame هست؟
                const video = document.querySelector('video');
                if (video) {
                    log('Video element: FOUND');
                    log('Video readyState: ' + video.readyState);
                    log('Video dimensions: ' + video.videoWidth + 'x' + video.videoHeight);
                } else {
                    log('Video element: NOT FOUND');
                }
            }, 2000);
        });
    </script>
</body>
</html>
