<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AR Test — LocAR.js</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    </style>
    <script src="/vendor/ar/aframe.min.js"></script>
    <script src="/vendor/ar/locar-aframe.js"></script>
</head>
<body>
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="antialias: true; alpha: true"
    >
        <a-camera
            locar-camera="gpsMinDistance: 2; positionMinAccuracy: 20; smoothingFactor: 5; enablePermissionDialog: false"
        ></a-camera>

        <a-entity
            locar-entity-place="latitude: 32.0498053; longitude: 48.8765405"
        >
            <a-ring color="#E8833A" radius-inner="0.8" radius-outer="1.2"
                    rotation="-90 0 0" position="0 0.05 0"
                    material="opacity: 0.9; transparent: true; side: double">
            </a-ring>
            <a-cylinder color="#F5A623" radius="0.15" height="3"
                        position="0 1.5 0"
                        material="opacity: 0.6; transparent: true">
            </a-cylinder>
            <a-text value="Test" color="#FFF" align="center"
                    position="0 3.5 0" scale="3 3 3">
            </a-text>
        </a-entity>
    </a-scene>

    <script>
        // لاگ کردن خطاها برای عیبیابی
        window.addEventListener('error', (e) => {
            console.error('[TEST-AR] Error:', e.error || e.message);
        });

        // بررسی بارگذاری کتابخانهها
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('[TEST-AR] AFRAME:', !!window.AFRAME);
                console.log('[TEST-AR] locar-camera registered:', 
                    !!(window.AFRAME && window.AFRAME.components['locar-camera']));
                console.log('[TEST-AR] locar-entity-place registered:', 
                    !!(window.AFRAME && window.AFRAME.components['locar-entity-place']));
            }, 1500);
        });
    </script>
</body>
</html>
